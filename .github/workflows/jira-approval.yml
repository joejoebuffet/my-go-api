name: Jira Approval Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  check-jira-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Jira Lint
        uses: cleartax/jira-lint@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          jira-base-url: ${{ secrets.JIRA_URL }}
          validate_issue_status: true
          allowed_issue_statuses: "Approved"